name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Lets mcp-publisher exchange a GitHub OIDC token for a registry one, so the
  # publish needs no stored credential; the namespace comes from the repo owner.
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Codex and Claude install from `release`, so it must always point at the
      # newest tag. Hermes has no ref pinning and keeps tracking main.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - name: Fast-forward the release channel to the new tag
        if: ${{ steps.release.outputs.release_created }}
        run: git push --force origin HEAD:release

      # Everything downstream reads this branch: both marketplaces pin ref `release`, and
      # the runtime's staleness check fetches release/version.txt. A channel left behind
      # means nobody is offered the release that was just tagged.
      - name: Verify the release channel serves the new tag
        if: ${{ steps.release.outputs.release_created }}
        run: |
          tag_sha="$(git rev-parse HEAD)"
          channel_sha="$(git ls-remote origin refs/heads/release | cut -f1)"
          test "$tag_sha" = "$channel_sha"
          test "$(cat version.txt)" = "${{ steps.release.outputs.version }}"

      # The registry serves whatever version was last pushed to it, so a release that
      # skips this leaves io.github.Cassette-Editor/oh-my-cassette advertising the old
      # one indefinitely — release-please bumps server.json but cannot publish it.
      # Runs last: a registry outage should not mask a broken release channel.
      - name: Publish the new version to the MCP registry
        if: ${{ steps.release.outputs.release_created }}
        env:
          PUBLISHER_VERSION: "1.8.0"
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
