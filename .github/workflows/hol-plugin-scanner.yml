# Required by the plugin directories that gate submissions on the HOL AI plugin
# scanner: they check that this workflow runs green on the default branch before
# reviewing an entry. It also keeps the local .plugin-scanner.toml honest: the job
# applies that file (trust_repository_policy) and fails if a real finding ever lands.
name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # uploads the SARIF report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@d7cf6e5bffd3a40be801e038c9705e1e67086c18 # v1
        with:
          plugin_dir: "."
          mode: scan
          profile: public-marketplace
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
          # The action ignores repository-owned scanner config unless told otherwise.
          # .plugin-scanner.toml only suppresses the test fixtures' fake credentials and
          # the marketplace rules written for vendored bundles, and it has code owners.
          trust_repository_policy: true
