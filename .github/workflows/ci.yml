name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # run the full matrix on any branch without a PR

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'skills/**'
              - '.agents/skills/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.mcp.json'
              - 'opencode.json'
              - 'server.json'
              - '.claude-plugin/**'
              - '.codex-plugin/**'
              - 'release-please-config.json'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (the local media preparation tests run it)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q -rs
      - name: Build the distribution the hosts will install
        run: uv build
      - name: Smoke-run the built wheel the way hosts do (uvx)
        run: |
          set -eu
          wheel="$(ls dist/oh_my_cassette-*.whl)"
          uvx --from "$wheel" oh-my-cassette --version

  # The one check branch protection requires: green when every job above passed or was skipped
  # because the change touches no code, red when any failed or was cancelled.
  ci-ok:
    needs: [changes, lint, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
