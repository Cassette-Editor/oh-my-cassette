name: Publish to PyPI

# Uses PyPI trusted publishing (OIDC): the project on PyPI must list this repository +
# workflow file as a trusted publisher. release-please dispatches it on the new tag, because
# a release it creates with GITHUB_TOKEN raises no `release` event; a release published by
# hand runs it too.
on:
  release:
    types: [published]
  # A run on a version tag publishes that release to PyPI. A run on a branch is a rehearsal
  # that uploads to TestPyPI (environment `testpypi`).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - name: Check that the tag matches the package version
        if: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          skip-existing: ${{ !(github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) }}

  # The registry serves whatever version was last pushed to it, so a release that skips
  # this leaves io.github.Cassette-Editor/oh-my-cassette advertising the old one. It
  # validates ownership through the `mcp-name:` marker in the PyPI README, so it must run
  # after the wheel is visible on PyPI.
  registry:
    needs: publish
    if: (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Wait until PyPI serves the released version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/oh-my-cassette/${version}/json" >/dev/null; then exit 0; fi
            sleep 10
          done
          echo "oh-my-cassette ${version} not visible on PyPI after 5 minutes" >&2
          exit 1
      - name: Publish the new version to the MCP registry
        env:
          PUBLISHER_VERSION: "1.8.0"
          # From registry_1.8.0_checksums.txt of that release.
          PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          set -eu
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
