name: Publish to PyPI

# Runs when release-please tags a release. Uses PyPI trusted publishing (OIDC): the
# project on PyPI must list this repository + workflow file as a trusted publisher.
on:
  release:
    types: [published]
  # Manual runs are rehearsals: they upload to TestPyPI (environment `testpypi`), never
  # to PyPI. Only a published release reaches PyPI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv build
      - name: Check that the tag matches the package version
        if: github.event_name == 'release'
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          skip-existing: ${{ github.event_name != 'release' }}

  # The registry serves whatever version was last pushed to it, so a release that skips
  # this leaves io.github.Cassette-Editor/oh-my-cassette advertising the old one. It
  # validates ownership through the `mcp-name:` marker in the PyPI README, so it must run
  # after the wheel is visible on PyPI.
  registry:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Wait until PyPI serves the released version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/oh-my-cassette/${version}/json" >/dev/null; then exit 0; fi
            sleep 10
          done
          echo "oh-my-cassette ${version} not visible on PyPI after 5 minutes" >&2
          exit 1
      - name: Publish the new version to the MCP registry
        env:
          PUBLISHER_VERSION: "1.8.0"
        run: |
          set -eu
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
