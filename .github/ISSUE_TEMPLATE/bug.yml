name: 🐛 Plugin bug
description: Something in the plugin itself is broken — install, auth, MCP tools, transport, or file handling.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: >-
        This form is for the **plugin** — the part in this repository. The editing
        engine that decides shots, pacing, music, and rendering is the separate
        Cassette service, and problems with the *result* of an edit can't be fixed
        here. See [SUPPORT.md](../blob/main/SUPPORT.md) if you're unsure which one
        you have.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: >-
            This is about the plugin — install, authentication, MCP tools,
            transport, file handling, or host integration. It is not about the
            quality of the edit the AI produced.
          required: true
        - label: I searched existing issues and discussions for this problem.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Ran `claude plugin install oh-my-cassette@cassette-editor`
        2. Asked the agent to edit ./footage
        3. Expected the import to start; got `file_not_found` instead
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Hermes Agent
        - Other MCP host
        - Web demo
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      description: The default is `api`. Pick "not sure" if you never changed it.
      options:
        - api (default)
        - browser
        - not sure
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - Plugin marketplace (claude/codex plugin install)
        - Hermes plugin manager
        - Git checkout / install_plugin.py
        - Web demo
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: >-
        Output of `uvx oh-my-cassette==<pinned version> --version`, or the pin
        in your host config.
      placeholder: "0.5.0"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: "macOS 15.3, Python 3.13.1"
    validations:
      required: true

  - type: textarea
    id: diagnose
    attributes:
      label: Tool result and server log
      description: >-
        Paste the full JSON the tool returned (every tool returns a typed
        `status`; failures carry `error.code`). If the server itself misbehaves,
        add its stderr with `OH_MY_CASSETTE_LOG=DEBUG` set in the host's server
        environment. Neither contains credentials.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error text
      description: >-
        Optional. Please redact emails, passwords, tokens, and absolute paths you
        would rather not share.
      render: text
    validations:
      required: false
