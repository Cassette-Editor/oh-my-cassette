name: cassette
version: 0.4.19 # x-release-please-version
manifest_version: 1
description: Shared Cassette MCP video editing with a thin QQ/Telegram gateway lifecycle adapter.
author: Oh My Cassette contributors
requires_env:
  - name: CASSETTE_AUTH_EMAIL
    description: Cassette account email used for API authentication
    url: https://trycassette.online
  - name: CASSETTE_AUTH_PASSWORD
    description: Cassette account password
    url: https://trycassette.online
    secret: true
provides_tools: []
provides_hooks:
  - pre_gateway_dispatch
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_finalize
  - on_session_reset
