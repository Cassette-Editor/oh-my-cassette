# Configuration for the HOL AI plugin scanner, which several plugin directories run
# against submitted repositories.

[scanner]
ignore_paths = [
  # Test fixtures and fake-backend credentials, not real secrets.
  "tests/*",
]

[rules]
disabled = [
  # Both rules require every marketplace entry to be a vendored local bundle. This
  # marketplace publishes a git source pinned to the `release` branch, which is how
  # Codex and Claude Code install the plugin; the runtime itself comes from PyPI.
  "MARKETPLACE_SOURCE_INVALID",
  "MARKETPLACE_UNSAFE_SOURCE",
]
